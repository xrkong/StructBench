# Notch-impact — Transolver HYBRID (Design A) REFERENCE-FRAME arm, seed 2.
# Identical to transolver-hybrid-s2 except hybrid_edge_frame = "reference": the
# local MP radius graph is built ONCE from the rest/reference coordinates and is
# STATIC across the rollout, instead of being rebuilt each step from the current
# (predicted) positions. iter2 (current-frame) FIXED the off-grid one-step
# (probe one-step 0.0014 < MGN 0.00214) but the drift feedback through the
# per-step-rebuilt graph ~tripled the rollout accumulation (probe ratio ~370x vs
# ~130x baseline, rollout 0.52). The static rest-frame graph removes the
# drift-feedback while keeping the local relative-structure representation.
# hybrid_radius = 7.5 mm = the notch MGN/CGN connectivity radius. Budget: 60k
# sanity-ladder step; input_frames = 6 per the card; train_frames = 250
# (ADR-0039 scored window). Not yet run.

[run]
benchmark = "notch_beam_2d_impact"
seed = 2

[model]
family = "transolver"
input_frames = 6                # notch card protocol (ADR-0035)
dim = 2
hidden_dim = 128                # ADR-0044 family reference
n_layers = 8
n_heads = 8
slice_num = 64
mlp_ratio = 1
dropout = 0.0
node_type_size = 4              # raw ids: 1 = beam, 2 = pin, 3 = supports (max id + 1)
noise_std = 0.003               # DP family-reference value (declared deviation from h250c 0.01)
normalizer_warmup_steps = 1000
weight_decay = 1e-5             # AdamW, thuml reference (ADR-0044); MP branch excluded
max_grad_norm = 0.1             # global-norm clip, thuml reference

velocity_history = true         # plain-VH: +5 window velocities, CGN random-walk noise +
                                # GNS adjusted-next target (ADR-0049); the only baseline delta
frames_per_call = 1             # ADR-0050/0051 prediction scheme: autoregressive next-step
hybrid_mp = true                # Design A local message-passing branch ON
hybrid_radius = 7.5             # working frame (mm) = notch MGN/CGN connectivity radius
hybrid_max_neighbors = 32       # per-node incoming-edge cap (~28 neighbours physical, under cap)
hybrid_blocks = 1               # one middle block (block L//2 = 4); minimal intervention
hybrid_edge_frame = "reference" # STATIC rest-frame graph (no drift feedback); iter3 fix

[train]
batch_size = 2                  # family reference (ADR-0044, matched to MGN)
lr_init = 1e-3                  # thuml reference start rate (ADR-0044)
lr_decay = 0.1                  # UNUSED by the transolver family (cosine anneal, ADR-0044)
training_steps = 60_000         # sanity-ladder budget (h250c blessing budget is 250k)
val_every = 2000                # h250c cadence
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
train_frames = 250              # ADR-0039 §4 recipe: train only the scored window
