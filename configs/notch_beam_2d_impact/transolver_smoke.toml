# CPU smoke of the Notch-impact Transolver train->checkpoint->eval path. NOT a
# baseline. Mirrors transolver.toml with a shrunk capacity cell.
# input_frames stays 6 — the notch card check (ADR-0035) applies to smokes too.

[run]
benchmark = "notch_beam_2d_impact"
seed = 0

[model]
family = "transolver"
input_frames = 6
dim = 2
hidden_dim = 16
n_layers = 2
n_heads = 2
slice_num = 8
mlp_ratio = 1
dropout = 0.0
node_type_size = 4
noise_std = 0.003
normalizer_warmup_steps = 5
weight_decay = 1e-5
max_grad_norm = 0.1

velocity_history = false      # reference Markovian feature builder (ADR-0049 off)
frames_per_call = 1            # ADR-0050/0051 prediction scheme: 1 = autoregressive next-step
hybrid_mp = false            # Design A hybrid local MP branch: off = vanilla Transolver
hybrid_radius = 0.0          # radius of the dynamic MP graph (inert while hybrid_mp=false)
hybrid_max_neighbors = 32    # per-node incoming-edge cap of the MP graph
hybrid_blocks = 1            # number of middle blocks carrying the MP branch
hybrid_edge_frame = "current"  # MP graph frame: current (predicted) positions | reference (static rest)

[train]
batch_size = 2
lr_init = 1e-3
lr_decay = 0.1
training_steps = 50
val_every = 25
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
train_frames = 0
