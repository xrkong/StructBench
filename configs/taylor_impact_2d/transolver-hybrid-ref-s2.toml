# Taylor 2D — Transolver HYBRID (Design A) REFERENCE-FRAME arm, seed 2.
# Identical to transolver-hybrid-s2 except hybrid_edge_frame = "reference": the
# local MP radius graph is built ONCE from the rest/reference coordinates and is
# STATIC across the rollout, instead of being rebuilt each step from the current
# (predicted) positions — removing the predicted-state drift feedback that a
# current-frame graph re-couples each step, while keeping the local relative-
# structure representation. hybrid_radius = 1.5 mm = the Taylor MGN/CGN
# connectivity radius. Budget: 60k (sanity ladder step, not the 100k blessing
# budget). Not yet run.

[run]
benchmark = "taylor_impact_2d"
seed = 2

[model]
family = "transolver"
input_frames = 6                # taylor card protocol (ADR-0035)
dim = 2
hidden_dim = 128                # ADR-0044 family reference
n_layers = 8
n_heads = 8
slice_num = 64
mlp_ratio = 1
dropout = 0.0
node_type_size = 3              # raw ids: 1 = bar SPH, 2 = wall (ADR-0047; max id + 1)
noise_std = 0.02                # blessed CGN taylor value (ADR-0049 noise rescale)
normalizer_warmup_steps = 1000
weight_decay = 1e-5             # AdamW, thuml reference (ADR-0044); MP branch excluded
max_grad_norm = 0.1             # global-norm clip, thuml reference

velocity_history = true         # +5 window velocities; CGN random-walk noise + GNS
                                # adjusted-next target (ADR-0049)
frames_per_call = 1             # ADR-0050/0051 prediction scheme: autoregressive next-step
hybrid_mp = true                # Design A local message-passing branch ON
hybrid_radius = 1.5             # working frame (mm) = Taylor MGN/CGN connectivity radius
hybrid_max_neighbors = 32       # per-node incoming-edge cap (bounds E; Taylor degree ~53
                                # in the mushroom, so this truncates by design)
hybrid_blocks = 1               # one middle block (block L//2 = 4); minimal intervention
hybrid_edge_frame = "reference" # STATIC rest-frame graph (no drift feedback); iter3 fix

[train]
batch_size = 2                  # family reference (ADR-0044, matched to MGN)
lr_init = 1e-3                  # thuml reference start rate (ADR-0044)
lr_decay = 0.1                  # UNUSED by the transolver family (cosine anneal, ADR-0044)
training_steps = 60_000         # sanity-ladder budget (not the 100k blessing budget)
val_every = 2000                # CGN taylor cadence
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
train_frames = 0
