# NOT a baseline — CPU smoke of the vehicle_barrier_crash_3d Transolver
# train->checkpoint->eval path, once real (or a tiny synthetic) data exists.
# Mirrors transolver.toml with a shrunk capacity cell and a short step budget,
# same pattern as configs/deforming_plate/transolver_smoke.toml.
#
# DRAFT / PLACEHOLDER — see transolver.toml's header; this file has the same
# TBD fields, just at smoke-test capacity.

[run]
benchmark = "vehicle_barrier_crash_3d"
seed = 0

[model]
family = "transolver"
input_frames = 2                 # TBD, see transolver.toml
dim = 3
hidden_dim = 16
n_layers = 2
n_heads = 2
slice_num = 8
mlp_ratio = 1
dropout = 0.0
node_type_size = 2                # real (2026-09-09): vehicle(0)/barrier(1),
                                   # see core.io.vehicle_barrier_crash.NODE_TYPE_SIZE
noise_std = 0.0
normalizer_warmup_steps = 5
weight_decay = 1e-5
max_grad_norm = 0.1

history_frames = 0
frames_per_call = 1
impact_velocity_feature = false
loading_features = 0             # TBD, see transolver.toml
time_conditioned = true
adaptive_temperature = false
slice_reparam = false

[train]
batch_size = 2
lr_init = 1e-3
lr_decay = 0.1
training_steps = 50
val_every = 25
w_pos = 1.0
w_aux = 1.0
aux_tail_weight = 0.0
train_frames = 0
